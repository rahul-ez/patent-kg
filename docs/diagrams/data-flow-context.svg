<text x="900.0" y="1017" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#202b3b" text-anchor="middle">Data maintainer</text>
<text x="540" y="405" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596777" text-anchor="middle">Credentials, idea, settings,</text>
<text x="540" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596777" text-anchor="middle">case / graph / report requests</text>
<text x="540" y="548" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596777" text-anchor="middle">Session status, ranked patents,</text>
<text x="540" y="567" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596777" text-anchor="middle">assessments, guidance and history</text>
<text x="1250" y="420" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596777" text-anchor="middle">Idea / evidence prompts</text>
<text x="1250" y="545" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596777" text-anchor="middle">Structured NLP, concept, scoring</text>
<text x="1250" y="564" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596777" text-anchor="middle">and explanation responses</text>
<text x="640" y="745" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596777" text-anchor="middle">Patent exports and</text>
<text x="640" y="764" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596777" text-anchor="middle">preparation settings</text>
<text x="1190" y="745" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596777" text-anchor="middle">Import / projection counts</text>
<text x="1190" y="764" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596777" text-anchor="middle">and build status</text>
<rect x="80" y="940" width="500" height="102" rx="0" fill="#f4f6f9" stroke="#d4dbe4" stroke-width="1.7"/>
<text x="97" y="968" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596777" text-anchor="start">The researcher uses the React web interface.</text>
<text x="97" y="992" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596777" text-anchor="start">Gemini calls have local fallback paths.</text>
<text x="97" y="1016" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#596777" text-anchor="start">Internal stores appear on the next sheet.</text>
<path d="M 60 1163 L 1740 1163" fill="none" stroke="#526274" stroke-width="1.3"/>
<text x="60" y="1186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#596777" text-anchor="start">Yourdon-DeMarco: circle = process | rectangle = external entity | parallel lines = data store | arrow = data flow</text>
<text x="60" y="1210" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#596777" text-anchor="start">Arrows name the data being transferred. Repeated IDs refer to the same entity/store. Line jumps are unconnected crossings.</text>
<text x="1680" y="1210" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#596777" text-anchor="middle">1 / 3</text>
