<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1480" viewBox="0 0 2200 1480" role="img" aria-labelledby="title description">
  <title id="title">Patent Intelligence Platform entity-relationship model</title>
  <desc id="description">Complete MySQL entity-relationship model for patent records, application access, and saved analysis results.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #4b5563; }
    .section { font-size: 19px; font-weight: 700; fill: #1e3a5f; }
    .entity { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
    .entity-head { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.5; }
    .entity-app { fill: #dcfce7; stroke: #22c55e; stroke-width: 1.5; }
    .entity-junction { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; }
    .name { font-size: 15px; font-weight: 700; }
    .field { font-size: 13px; }
    .key { font-weight: 700; fill: #1d4ed8; }
    .fk { fill: #7c3aed; }
    .rel { fill: none; stroke: #64748b; stroke-width: 2; }
    .rel-app { fill: none; stroke: #15803d; stroke-width: 2; }
    .rel-self { fill: none; stroke: #b45309; stroke-width: 2; }
    .cardinality { font-size: 12px; font-weight: 700; fill: #475569; }
    .label { font-size: 12px; fill: #475569; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .legend { font-size: 12px; fill: #475569; }
  </style>

  <rect width="2200" height="1480" fill="#ffffff"/>
  <text x="60" y="55" class="title">Patent Intelligence Platform — MySQL Entity-Relationship Model</text>
  <text x="60" y="82" class="subtitle">Implemented schema: database/sql/01_schema.sql · PK = primary key · FK = foreign key · UK = unique key</text>

  <rect x="35" y="110" width="950" height="1325" rx="10" class="panel"/>
  <text x="60" y="140" class="section">Patent knowledge model</text>
  <rect x="1085" y="110" width="1080" height="1325" rx="10" class="panel"/>
  <text x="1110" y="140" class="section">Application persistence and access model</text>

  <!-- Relationships: patent knowledge model -->
  <path d="M290 205 H330 V365 H360" class="rel"/>
  <text x="297" y="195" class="cardinality">1</text><text x="340" y="354" class="cardinality">0..*</text>
  <text x="300" y="285" class="label">classifies</text>

  <path d="M630 415 H660 V487 H690" class="rel"/>
  <text x="638" y="405" class="cardinality">1</text><text x="674" y="477" class="cardinality">0..*</text>
  <path d="M290 487 H320 V550 H660 V487 H690" class="rel"/>
  <text x="297" y="478" class="cardinality">1</text><text x="670" y="540" class="cardinality">0..*</text>

  <path d="M630 455 H660 V647 H690" class="rel"/>
  <text x="638" y="465" class="cardinality">1</text><text x="674" y="637" class="cardinality">0..*</text>
  <path d="M290 647 H690" class="rel"/>
  <text x="297" y="637" class="cardinality">1</text><text x="675" y="637" class="cardinality">0..*</text>

  <path d="M630 495 H660 V807 H690" class="rel"/>
  <text x="638" y="505" class="cardinality">1</text><text x="674" y="797" class="cardinality">0..*</text>
  <path d="M290 807 H690" class="rel"/>
  <text x="297" y="797" class="cardinality">1</text><text x="675" y="797" class="cardinality">0..*</text>

  <path d="M630 515 H675 V967 H690" class="rel"/>
  <text x="638" y="525" class="cardinality">1</text><text x="675" y="957" class="cardinality">0..*</text>
  <path d="M290 967 H690" class="rel"/>
  <text x="297" y="957" class="cardinality">1</text><text x="675" y="957" class="cardinality">0..*</text>

  <path d="M445 520 V1080" class="rel-self"/>
  <path d="M545 520 V1080" class="rel-self"/>
  <text x="453" y="795" class="label">source / related</text>
  <text x="430" y="535" class="cardinality">1</text><text x="535" y="535" class="cardinality">1</text>
  <text x="430" y="1070" class="cardinality">0..*</text><text x="535" y="1070" class="cardinality">0..*</text>

  <path d="M630 500 H660 V1142 H690" class="rel"/>
  <text x="638" y="510" class="cardinality">1</text><text x="674" y="1132" class="cardinality">0..*</text>

  <!-- Relationships: application model -->
  <path d="M1280 260 V320 H1300" class="rel-app"/>
  <text x="1287" y="280" class="cardinality">1</text><text x="1287" y="312" class="cardinality">0..*</text>
  <path d="M1590 260 V320 H1560" class="rel-app"/>
  <text x="1580" y="280" class="cardinality">1</text><text x="1570" y="312" class="cardinality">0..*</text>
  <path d="M1280 260 V410 H1540 V535 H1600" class="rel-app"/>
  <text x="1287" y="400" class="cardinality">1</text><text x="1550" y="525" class="cardinality">0..*</text>
  <text x="1390" y="401" class="label">owns (optional)</text>

  <path d="M1735 620 V700" class="rel-app"/>
  <text x="1743" y="647" class="cardinality">1</text><text x="1743" y="692" class="cardinality">0..*</text>
  <path d="M1700 810 V875 H1570 V930" class="rel-app"/>
  <text x="1708" y="838" class="cardinality">1</text><text x="1580" y="920" class="cardinality">0..*</text>
  <path d="M1770 810 H1870 V960" class="rel-app"/>
  <text x="1780" y="800" class="cardinality">1</text><text x="1860" y="950" class="cardinality">0..1</text>
  <path d="M1785 810 H1840 V1170 H1870" class="rel-app"/>
  <text x="1795" y="800" class="cardinality">1</text><text x="1850" y="1160" class="cardinality">0..*</text>
  <path d="M930 982 H1450" class="rel"/>
  <text x="938" y="972" class="cardinality">1</text><text x="1420" y="972" class="cardinality">0..*</text>
  <text x="1120" y="970" class="label">appears in saved result</text>

  <!-- Patent knowledge entities -->
  <g transform="translate(60 155)">
    <rect width="230" height="100" rx="5" class="entity-head"/><text x="12" y="24" class="name">DOMAINS</text>
    <line x1="0" y1="34" x2="230" y2="34" stroke="#3b82f6"/>
    <text x="12" y="56" class="field key">PK domain_id</text><text x="12" y="78" class="field">UK name</text>
  </g>
  <g transform="translate(360 310)">
    <rect width="270" height="210" rx="5" class="entity-head"/><text x="12" y="24" class="name">PATENTS</text>
    <line x1="0" y1="34" x2="270" y2="34" stroke="#3b82f6"/>
    <text x="12" y="56" class="field key">PK patent_id</text><text x="12" y="78" class="field fk">FK domain_id</text>
    <text x="12" y="100" class="field">title, abstract</text><text x="12" y="122" class="field">publication_year</text>
    <text x="12" y="144" class="field">legal_status</text><text x="12" y="166" class="field">cited_by_patent_count</text>
    <text x="12" y="188" class="field">created_at, updated_at</text>
  </g>
  <g transform="translate(60 440)">
    <rect width="230" height="95" rx="5" class="entity"/><text x="12" y="24" class="name">ASSIGNEES</text>
    <line x1="0" y1="34" x2="230" y2="34" stroke="#64748b"/><text x="12" y="58" class="field key">PK assignee_id</text><text x="12" y="80" class="field">UK name</text>
  </g>
  <g transform="translate(690 440)">
    <rect width="240" height="95" rx="5" class="entity-junction"/><text x="12" y="24" class="name">PATENT_ASSIGNEES</text>
    <line x1="0" y1="34" x2="240" y2="34" stroke="#f59e0b"/><text x="12" y="58" class="field key">PK, FK patent_id</text><text x="12" y="80" class="field key">PK, FK assignee_id</text>
  </g>
  <g transform="translate(60 600)">
    <rect width="230" height="95" rx="5" class="entity"/><text x="12" y="24" class="name">INVENTORS</text>
    <line x1="0" y1="34" x2="230" y2="34" stroke="#64748b"/><text x="12" y="58" class="field key">PK inventor_id</text><text x="12" y="80" class="field">UK name</text>
  </g>
  <g transform="translate(690 600)">
    <rect width="240" height="95" rx="5" class="entity-junction"/><text x="12" y="24" class="name">PATENT_INVENTORS</text>
    <line x1="0" y1="34" x2="240" y2="34" stroke="#f59e0b"/><text x="12" y="58" class="field key">PK, FK patent_id</text><text x="12" y="80" class="field key">PK, FK inventor_id</text>
  </g>
  <g transform="translate(60 760)">
    <rect width="230" height="95" rx="5" class="entity"/><text x="12" y="24" class="name">CPC_CODES</text>
    <line x1="0" y1="34" x2="230" y2="34" stroke="#64748b"/><text x="12" y="58" class="field key">PK cpc_code</text><text x="12" y="80" class="field">section, description</text>
  </g>
  <g transform="translate(690 760)">
    <rect width="240" height="95" rx="5" class="entity-junction"/><text x="12" y="24" class="name">PATENT_CPC_CODES</text>
    <line x1="0" y1="34" x2="240" y2="34" stroke="#f59e0b"/><text x="12" y="58" class="field key">PK, FK patent_id</text><text x="12" y="80" class="field key">PK, FK cpc_code</text>
  </g>
  <g transform="translate(60 920)">
    <rect width="230" height="95" rx="5" class="entity"/><text x="12" y="24" class="name">NPL_REFERENCES</text>
    <line x1="0" y1="34" x2="230" y2="34" stroke="#64748b"/><text x="12" y="58" class="field key">PK npl_id</text><text x="12" y="80" class="field">citation, UK normalized_key</text>
  </g>
  <g transform="translate(690 920)">
    <rect width="240" height="95" rx="5" class="entity-junction"/><text x="12" y="24" class="name">PATENT_NPL_REFERENCES</text>
    <line x1="0" y1="34" x2="240" y2="34" stroke="#f59e0b"/><text x="12" y="58" class="field key">PK, FK patent_id</text><text x="12" y="80" class="field key">PK, FK npl_id</text>
  </g>
  <g transform="translate(360 1080)">
    <rect width="270" height="115" rx="5" class="entity-junction"/><text x="12" y="24" class="name">PATENT_FAMILIES</text>
    <line x1="0" y1="34" x2="270" y2="34" stroke="#f59e0b"/><text x="12" y="58" class="field key">PK, FK patent_id</text><text x="12" y="80" class="field key">PK, FK related_patent_id</text><text x="12" y="102" class="field key">PK relation_type</text>
  </g>
  <g transform="translate(690 1080)">
    <rect width="240" height="125" rx="5" class="entity"/><text x="12" y="24" class="name">CITATION_SNAPSHOTS</text>
    <line x1="0" y1="34" x2="240" y2="34" stroke="#64748b"/><text x="12" y="58" class="field key">PK snapshot_id</text><text x="12" y="80" class="field fk">FK patent_id</text><text x="12" y="102" class="field">cited_by_count, observed_on</text>
  </g>

  <!-- Application entities -->
  <g transform="translate(1160 165)">
    <rect width="240" height="95" rx="5" class="entity-app"/><text x="12" y="24" class="name">APP_USERS</text>
    <line x1="0" y1="34" x2="240" y2="34" stroke="#22c55e"/><text x="12" y="58" class="field key">PK user_id</text><text x="12" y="80" class="field">UK email, display_name</text>
  </g>
  <g transform="translate(1460 165)">
    <rect width="260" height="95" rx="5" class="entity-app"/><text x="12" y="24" class="name">ROLES</text>
    <line x1="0" y1="34" x2="260" y2="34" stroke="#22c55e"/><text x="12" y="58" class="field key">PK role_id</text><text x="12" y="80" class="field">UK name</text>
  </g>
  <g transform="translate(1300 320)">
    <rect width="260" height="115" rx="5" class="entity-junction"/><text x="12" y="24" class="name">USER_ROLES</text>
    <line x1="0" y1="34" x2="260" y2="34" stroke="#f59e0b"/><text x="12" y="58" class="field key">PK, FK user_id</text><text x="12" y="80" class="field key">PK, FK role_id</text>
  </g>
  <g transform="translate(1600 470)">
    <rect width="270" height="150" rx="5" class="entity-app"/><text x="12" y="24" class="name">ANALYSIS_CASES</text>
    <line x1="0" y1="34" x2="270" y2="34" stroke="#22c55e"/><text x="12" y="58" class="field key">PK case_id</text><text x="12" y="80" class="field fk">FK owner_user_id (nullable)</text><text x="12" y="102" class="field">title, idea_text, status</text><text x="12" y="124" class="field">created_at, updated_at</text>
  </g>
  <g transform="translate(1600 700)">
    <rect width="270" height="110" rx="5" class="entity-app"/><text x="12" y="24" class="name">ANALYSIS_RUNS</text>
    <line x1="0" y1="34" x2="270" y2="34" stroke="#22c55e"/><text x="12" y="58" class="field key">PK run_id</text><text x="12" y="80" class="field fk">FK case_id · UK query_id</text><text x="12" y="102" class="field">gnn_mode, top_k, run_status</text>
  </g>
  <g transform="translate(1450 930)">
    <rect width="300" height="140" rx="5" class="entity-junction"/><text x="12" y="24" class="name">RUN_PATENT_RESULTS</text>
    <line x1="0" y1="34" x2="300" y2="34" stroke="#f59e0b"/><text x="12" y="58" class="field key">PK, FK run_id</text><text x="12" y="80" class="field key">PK, FK patent_id</text><text x="12" y="102" class="field">UK (run_id, rank_position) · source</text><text x="12" y="124" class="field">semantic, graph, combined scores</text>
  </g>
  <g transform="translate(1870 900)">
    <rect width="245" height="120" rx="5" class="entity-app"/><text x="12" y="24" class="name">EVALUATION_METRICS</text>
    <line x1="0" y1="34" x2="245" y2="34" stroke="#22c55e"/><text x="12" y="58" class="field key">PK metric_id</text><text x="12" y="80" class="field fk">FK, UK run_id</text><text x="12" y="102" class="field">score, risk, verdict</text>
  </g>
  <g transform="translate(1870 1110)">
    <rect width="245" height="135" rx="5" class="entity-app"/><text x="12" y="24" class="name">IMPROVEMENT_RECOMMENDATIONS</text>
    <line x1="0" y1="34" x2="245" y2="34" stroke="#22c55e"/><text x="12" y="58" class="field key">PK recommendation_id</text><text x="12" y="80" class="field fk">FK run_id</text><text x="12" y="102" class="field">UK (run_id, position)</text><text x="12" y="124" class="field">category, recommendation</text>
  </g>

  <text x="60" y="1410" class="legend">Cardinality: 1 = exactly one · 0..1 = optional one · 0..* = zero or more. Yellow entities resolve many-to-many relationships.</text>
</svg>
