<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800" role="img" aria-labelledby="title desc">
  <title id="title">Patent knowledge data Chen ER diagram</title>
  <desc id="desc">Chen notation ER diagram for patent metadata, parties, classifications, literature citations, family links, and citation snapshots.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
    .title { font-size: 34px; font-weight: 700; }.sub { font-size: 18px; fill: #475569; }
    .entity { fill: #eef6ff; stroke: #2563eb; stroke-width: 3; }.relationship { fill: #fff8df; stroke: #a16207; stroke-width: 3; }
    .attribute { fill: #fff; stroke: #64748b; stroke-width: 2.2; }.line { fill: none; stroke: #64748b; stroke-width: 2.5; }
    .entity-text { font-size: 22px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }.rel-text { font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .attr-text { font-size: 16px; text-anchor: middle; dominant-baseline: middle; }.card { font-size: 19px; font-weight: 700; fill: #9a3412; }.note { font-size: 15px; fill: #475569; }
  </style>
  <rect width="2400" height="1800" fill="#fff"/>
  <text x="70" y="70" class="title">Patent Intelligence Platform — ER Diagram, Sheet 1 of 2</text>
  <text x="70" y="105" class="sub">Patent knowledge, people, classifications, citations, and family relationships · Chen notation</text>

  <!-- Central PATENT entity -->
  <rect x="1000" y="790" width="300" height="90" class="entity"/><text x="1150" y="835" class="entity-text">PATENT</text>
  <ellipse cx="1150" cy="620" rx="96" ry="34" class="attribute"/><text x="1150" y="620" class="attr-text" text-decoration="underline">patent_id</text><path d="M1150 654 V790" class="line"/>
  <ellipse cx="910" cy="650" rx="66" ry="32" class="attribute"/><text x="910" y="650" class="attr-text">title</text><path d="M962 672 L1030 790" class="line"/>
  <ellipse cx="870" cy="1010" rx="80" ry="32" class="attribute"/><text x="870" y="1010" class="attr-text">abstract</text><path d="M935 987 L1030 880" class="line"/>
  <ellipse cx="1100" cy="1060" rx="112" ry="32" class="attribute"/><text x="1100" y="1060" class="attr-text">publication_year</text><path d="M1115 1028 L1125 880" class="line"/>
  <ellipse cx="1430" cy="650" rx="93" ry="32" class="attribute"/><text x="1430" y="650" class="attr-text">legal_status</text><path d="M1365 674 L1270 790" class="line"/>
  <ellipse cx="1470" cy="1010" rx="118" ry="32" class="attribute"/><text x="1470" y="1010" class="attr-text">cited_by_count</text><path d="M1380 990 L1270 880" class="line"/>

  <!-- DOMAIN 1:N PATENT -->
  <rect x="290" y="420" width="220" height="78" class="entity"/><text x="400" y="459" class="entity-text">DOMAIN</text>
  <ellipse cx="300" cy="270" rx="94" ry="32" class="attribute"/><text x="300" y="270" class="attr-text" text-decoration="underline">domain_id</text><path d="M330 301 L365 420" class="line"/>
  <ellipse cx="545" cy="285" rx="64" ry="32" class="attribute"/><text x="545" y="285" class="attr-text">name</text><path d="M525 316 L465 420" class="line"/>
  <path d="M510 458 L715 615 L1000 800" class="line"/><text x="570" y="510" class="card">1</text><text x="945" y="770" class="card">N</text>
  <polygon points="715,560 800,615 715,670 630,615" class="relationship"/><text x="715" y="608" class="rel-text">BELONGS</text><text x="715" y="627" class="rel-text">TO</text>

  <!-- ASSIGNEE M:N PATENT -->
  <rect x="250" y="815" width="230" height="78" class="entity"/><text x="365" y="854" class="entity-text">ASSIGNEE</text>
  <ellipse cx="235" cy="990" rx="102" ry="32" class="attribute"/><text x="235" y="990" class="attr-text" text-decoration="underline">assignee_id</text><path d="M270 960 L330 893" class="line"/>
  <ellipse cx="525" cy="990" rx="66" ry="32" class="attribute"/><text x="525" y="990" class="attr-text">name</text><path d="M500 960 L440 893" class="line"/>
  <path d="M480 854 H670 H1000" class="line"/><text x="535" y="842" class="card">N</text><text x="950" y="842" class="card">N</text>
  <polygon points="670,799 760,854 670,909 580,854" class="relationship"/><text x="670" y="847" class="rel-text">ASSIGNED</text><text x="670" y="866" class="rel-text">TO</text>

  <!-- INVENTOR M:N PATENT -->
  <rect x="290" y="1325" width="230" height="78" class="entity"/><text x="405" y="1364" class="entity-text">INVENTOR</text>
  <ellipse cx="280" cy="1515" rx="100" ry="32" class="attribute"/><text x="280" y="1515" class="attr-text" text-decoration="underline">inventor_id</text><path d="M315 1485 L375 1403" class="line"/>
  <ellipse cx="560" cy="1515" rx="66" ry="32" class="attribute"/><text x="560" y="1515" class="attr-text">name</text><path d="M535 1485 L470 1403" class="line"/>
  <path d="M520 1364 L720 1200 L1050 880" class="line"/><text x="570" y="1338" class="card">N</text><text x="1010" y="925" class="card">N</text>
  <polygon points="720,1145 810,1200 720,1255 630,1200" class="relationship"/><text x="720" y="1200" class="rel-text">INVENTS</text>

  <!-- CPC CODE M:N PATENT -->
  <rect x="1710" y="420" width="240" height="78" class="entity"/><text x="1830" y="459" class="entity-text">CPC CODE</text>
  <ellipse cx="1710" cy="270" rx="90" ry="32" class="attribute"/><text x="1710" y="270" class="attr-text" text-decoration="underline">cpc_code</text><path d="M1740 301 L1780 420" class="line"/>
  <ellipse cx="1980" cy="285" rx="66" ry="32" class="attribute"/><text x="1980" y="285" class="attr-text">section</text><path d="M1940 316 L1890 420" class="line"/>
  <ellipse cx="2050" cy="580" rx="92" ry="32" class="attribute"/><text x="2050" y="580" class="attr-text">description</text><path d="M1990 557 L1920 498" class="line"/>
  <path d="M1710 458 L1570 615 L1300 800" class="line"/><text x="1650" y="510" class="card">N</text><text x="1325" y="770" class="card">N</text>
  <polygon points="1570,560 1660,615 1570,670 1480,615" class="relationship"/><text x="1570" y="608" class="rel-text">CLASSIFIED</text><text x="1570" y="627" class="rel-text">AS</text>

  <!-- NPL REFERENCE M:N PATENT -->
  <rect x="1710" y="815" width="260" height="78" class="entity"/><text x="1840" y="854" class="entity-text">NPL REFERENCE</text>
  <ellipse cx="1700" cy="990" rx="70" ry="32" class="attribute"/><text x="1700" y="990" class="attr-text" text-decoration="underline">npl_id</text><path d="M1730 960 L1770 893" class="line"/>
  <ellipse cx="1950" cy="990" rx="76" ry="32" class="attribute"/><text x="1950" y="990" class="attr-text">citation</text><path d="M1915 960 L1880 893" class="line"/>
  <ellipse cx="2110" cy="1090" rx="110" ry="32" class="attribute"/><text x="2110" y="1090" class="attr-text">normalized_key</text><path d="M2040 1065 L1930 893" class="line"/>
  <path d="M1710 854 H1530 H1300" class="line"/><text x="1650" y="842" class="card">N</text><text x="1325" y="842" class="card">N</text>
  <polygon points="1530,799 1620,854 1530,909 1440,854" class="relationship"/><text x="1530" y="854" class="rel-text">CITES</text>

  <!-- CITATION SNAPSHOT 1:N PATENT -->
  <rect x="1690" y="1325" width="290" height="78" class="entity"/><text x="1835" y="1364" class="entity-text">CITATION SNAPSHOT</text>
  <ellipse cx="1700" cy="1515" rx="104" ry="32" class="attribute"/><text x="1700" y="1515" class="attr-text" text-decoration="underline">snapshot_id</text><path d="M1740 1485 L1790 1403" class="line"/>
  <ellipse cx="1980" cy="1515" rx="112" ry="32" class="attribute"/><text x="1980" y="1515" class="attr-text">cited_by_count</text><path d="M1940 1485 L1890 1403" class="line"/>
  <ellipse cx="1850" cy="1630" rx="96" ry="32" class="attribute"/><text x="1850" y="1630" class="attr-text">observed_on</text><path d="M1850 1598 V1403" class="line"/>
  <path d="M1690 1364 L1570 1200 L1260 880" class="line"/><text x="1630" y="1338" class="card">N</text><text x="1290" y="925" class="card">1</text>
  <polygon points="1570,1145 1660,1200 1570,1255 1480,1200" class="relationship"/><text x="1570" y="1200" class="rel-text">HAS</text>

  <!-- PATENT M:N PATENT family relationship -->
  <path d="M1080 880 L1000 1380 L1120 1490" class="line"/><path d="M1220 880 L1290 1380 L1120 1490" class="line"/>
  <text x="1020" y="1310" class="card">N</text><text x="1270" y="1310" class="card">N</text>
  <polygon points="1120,1435 1215,1490 1120,1545 1025,1490" class="relationship"/><text x="1120" y="1483" class="rel-text">RELATED</text><text x="1120" y="1502" class="rel-text">TO</text>
  <ellipse cx="1380" cy="1515" rx="96" ry="32" class="attribute"/><text x="1380" y="1515" class="attr-text">relation_type</text><path d="M1280 1505 L1215 1495" class="line"/>

  <text x="70" y="1735" class="note">Underlined attributes are keys. N:N relationships are implemented by junction tables: patent_assignees, patent_inventors, patent_cpc_codes, patent_npl_references, and patent_families.</text>
</svg>
