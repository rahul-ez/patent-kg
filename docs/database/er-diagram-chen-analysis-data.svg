<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1700" viewBox="0 0 2200 1700" role="img" aria-labelledby="title desc">
  <title id="title">Analysis and access data Chen ER diagram</title>
  <desc id="desc">Chen notation ER diagram for application users, roles, saved analysis cases, analysis runs, result patents, metrics, and recommendations.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
    .title { font-size: 34px; font-weight: 700; }.sub { font-size: 18px; fill: #475569; }
    .entity { fill: #eefbf3; stroke: #15803d; stroke-width: 3; }.patent { fill: #eef6ff; stroke: #2563eb; stroke-width: 3; }.relationship { fill: #fff8df; stroke: #a16207; stroke-width: 3; }
    .attribute { fill: #fff; stroke: #64748b; stroke-width: 2.2; }.line { fill: none; stroke: #15803d; stroke-width: 2.5; }.line-patent { fill: none; stroke: #64748b; stroke-width: 2.5; }
    .entity-text { font-size: 22px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }.rel-text { font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .attr-text { font-size: 16px; text-anchor: middle; dominant-baseline: middle; }.card { font-size: 19px; font-weight: 700; fill: #9a3412; }.note { font-size: 15px; fill: #475569; }
  </style>
  <rect width="2200" height="1700" fill="#fff"/>
  <text x="70" y="70" class="title">Patent Intelligence Platform — ER Diagram, Sheet 2 of 2</text>
  <text x="70" y="105" class="sub">User access, saved analysis cases, pipeline runs, evaluation metrics, and recommendations · Chen notation</text>

  <!-- APP USER and ROLE M:N -->
  <rect x="240" y="340" width="230" height="78" class="entity"/><text x="355" y="379" class="entity-text">APP USER</text>
  <ellipse cx="260" cy="200" rx="82" ry="32" class="attribute"/><text x="260" y="200" class="attr-text" text-decoration="underline">user_id</text><path d="M285 231 L320 340" class="line"/>
  <ellipse cx="505" cy="210" rx="62" ry="32" class="attribute"/><text x="505" y="210" class="attr-text">email</text><path d="M485 241 L420 340" class="line"/>
  <ellipse cx="535" cy="475" rx="96" ry="32" class="attribute"/><text x="535" y="475" class="attr-text">display_name</text><path d="M480 452 L435 418" class="line"/>
  <rect x="1430" y="340" width="200" height="78" class="entity"/><text x="1530" y="379" class="entity-text">ROLE</text>
  <ellipse cx="1450" cy="200" rx="82" ry="32" class="attribute"/><text x="1450" y="200" class="attr-text" text-decoration="underline">role_id</text><path d="M1475 231 L1500 340" class="line"/>
  <ellipse cx="1670" cy="210" rx="62" ry="32" class="attribute"/><text x="1670" y="210" class="attr-text">name</text><path d="M1640 241 L1580 340" class="line"/>
  <path d="M470 379 H935 H1430" class="line"/><text x="530" y="365" class="card">N</text><text x="1365" y="365" class="card">N</text>
  <polygon points="935,324 1025,379 935,434 845,379" class="relationship"/><text x="935" y="372" class="rel-text">HAS</text><text x="935" y="391" class="rel-text">ROLE</text>

  <!-- User 0..N owns Analysis Case -->
  <rect x="710" y="650" width="310" height="84" class="entity"/><text x="865" y="692" class="entity-text">ANALYSIS CASE</text>
  <ellipse cx="775" cy="530" rx="82" ry="32" class="attribute"/><text x="775" y="530" class="attr-text" text-decoration="underline">case_id</text><path d="M800 561 L825 650" class="line"/>
  <ellipse cx="1115" cy="520" rx="62" ry="32" class="attribute"/><text x="1115" y="520" class="attr-text">title</text><path d="M1060 546 L980 650" class="line"/>
  <ellipse cx="1170" cy="690" rx="78" ry="32" class="attribute"/><text x="1170" y="690" class="attr-text">idea_text</text><path d="M1092 690 H1020" class="line"/>
  <ellipse cx="1110" cy="840" rx="64" ry="32" class="attribute"/><text x="1110" y="840" class="attr-text">status</text><path d="M1050 820 L970 734" class="line"/>
  <path d="M380 418 L500 570 L710 680" class="line"/><text x="440" y="510" class="card">0..N</text><text x="650" y="655" class="card">0..1</text>
  <polygon points="500,515 590,570 500,625 410,570" class="relationship"/><text x="500" y="570" class="rel-text">OWNS</text>

  <!-- Case 1:N Analysis Run -->
  <rect x="710" y="1050" width="310" height="84" class="entity"/><text x="865" y="1092" class="entity-text">ANALYSIS RUN</text>
  <ellipse cx="535" cy="1000" rx="82" ry="32" class="attribute"/><text x="535" y="1000" class="attr-text" text-decoration="underline">run_id</text><path d="M600 1018 L710 1070" class="line"/>
  <ellipse cx="545" cy="1165" rx="72" ry="32" class="attribute"/><text x="545" y="1165" class="attr-text">query_id</text><path d="M610 1145 L710 1110" class="line"/>
  <ellipse cx="900" cy="1215" rx="78" ry="32" class="attribute"/><text x="900" y="1215" class="attr-text">gnn_mode</text><path d="M890 1183 L880 1134" class="line"/>
  <ellipse cx="1100" cy="1165" rx="84" ry="32" class="attribute"/><text x="1100" y="1165" class="attr-text">run_status</text><path d="M1040 1145 L1000 1115" class="line"/>
  <path d="M865 734 V865 V1050" class="line"/><text x="880" y="795" class="card">1</text><text x="880" y="1005" class="card">0..N</text>
  <polygon points="865,810 955,865 865,920 775,865" class="relationship"/><text x="865" y="865" class="rel-text">CONTAINS</text>

  <!-- Run M:N retrieves Patent; attributes are RUN_PATENT_RESULTS -->
  <rect x="175" y="1250" width="230" height="78" class="patent"/><text x="290" y="1289" class="entity-text">PATENT</text>
  <text x="175" y="1365" class="note">See Sheet 1 for attributes</text>
  <path d="M405 1289 H460" class="line-patent"/>
  <path d="M640 1234 L710 1120" class="line-patent"/>
  <text x="425" y="1275" class="card">N</text><text x="665" y="1175" class="card">N</text>
  <polygon points="550,1234 640,1289 550,1344 460,1289" class="relationship"/><text x="550" y="1282" class="rel-text">RETRIEVES</text><text x="550" y="1301" class="rel-text">RESULT</text>
  <ellipse cx="550" cy="1455" rx="112" ry="32" class="attribute"/><text x="550" y="1455" class="attr-text">rank_position</text><path d="M550 1423 V1344" class="line-patent"/>
  <ellipse cx="780" cy="1390" rx="60" ry="32" class="attribute"/><text x="780" y="1390" class="attr-text">source</text><path d="M730 1370 L625 1320" class="line-patent"/>
  <ellipse cx="860" cy="1495" rx="108" ry="32" class="attribute"/><text x="860" y="1495" class="attr-text">combined_score</text><path d="M780 1470 L625 1330" class="line-patent"/>
  <text x="300" y="1570" class="note">Also: semantic_score, graph_score, novelty_score, expansion_type.</text>

  <!-- Evaluation metric 0..1 per run -->
  <rect x="1510" y="1045" width="330" height="84" class="entity"/><text x="1675" y="1087" class="entity-text">EVALUATION METRIC</text>
  <ellipse cx="1630" cy="910" rx="96" ry="32" class="attribute"/><text x="1630" y="910" class="attr-text" text-decoration="underline">metric_id</text><path d="M1650 942 L1660 1045" class="line"/>
  <ellipse cx="1880" cy="925" rx="66" ry="32" class="attribute"/><text x="1880" y="925" class="attr-text">score</text><path d="M1845 955 L1780 1045" class="line"/>
  <ellipse cx="1915" cy="1175" rx="58" ry="32" class="attribute"/><text x="1915" y="1175" class="attr-text">risk</text><path d="M1870 1150 L1810 1129" class="line"/>
  <ellipse cx="1560" cy="1215" rx="72" ry="32" class="attribute"/><text x="1560" y="1215" class="attr-text">verdict</text><path d="M1590 1183 L1640 1129" class="line"/>
  <path d="M1020 1092 H1265 H1510" class="line"/><text x="1070" y="1078" class="card">1</text><text x="1445" y="1078" class="card">0..1</text>
  <polygon points="1265,1037 1355,1092 1265,1147 1175,1092" class="relationship"/><text x="1265" y="1092" class="rel-text">EVALUATES</text>

  <!-- Run 1:N recommendations -->
  <rect x="1480" y="1390" width="430" height="84" class="entity"/><text x="1695" y="1432" class="entity-text">IMPROVEMENT RECOMMENDATION</text>
  <ellipse cx="1520" cy="1550" rx="126" ry="32" class="attribute"/><text x="1520" y="1550" class="attr-text" text-decoration="underline">recommendation_id</text><path d="M1570 1525 L1620 1474" class="line"/>
  <ellipse cx="1800" cy="1550" rx="66" ry="32" class="attribute"/><text x="1800" y="1550" class="attr-text">position</text><path d="M1780 1518 L1760 1474" class="line"/>
  <ellipse cx="2000" cy="1540" rx="72" ry="32" class="attribute"/><text x="2000" y="1540" class="attr-text">category</text><path d="M1960 1513 L1870 1474" class="line"/>
  <ellipse cx="1690" cy="1640" rx="112" ry="32" class="attribute"/><text x="1690" y="1640" class="attr-text">recommendation</text><path d="M1690 1608 V1474" class="line"/>
  <path d="M1020 1134 L1210 1320 L1480 1432" class="line"/><text x="1080" y="1190" class="card">1</text><text x="1415" y="1415" class="card">0..N</text>
  <polygon points="1210,1265 1300,1320 1210,1375 1120,1320" class="relationship"/><text x="1210" y="1320" class="rel-text">PRODUCES</text>

  <text x="70" y="1645" class="note">Underlined attributes are keys. Relationship tables in the MySQL implementation: user_roles and run_patent_results.</text>
</svg>
